hover_bg = "#ebebeb"
active_bg = "#dcdcdc"
selection = "#add6ff"
selection_inactive = "#d6e9ff"
focus_ring = "#0f4a85"
button_bg = "#ffffff"
button_text = "#000000"
button_primary_bg = "#000000"
button_primary_text = "#ffffff"
permission_bar_bg = "#ffffff"
notification_bg = "#ffffff"
error = "#b00020"
warning = "#7a4f00"
success = "#0f6b2e"

[editor]
