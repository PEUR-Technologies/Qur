[package]
name = "qur_app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "qur"
path = "src/main.rs"

[dependencies]
qur_acp.workspace = true
qur_agents.workspace = true
qur_browser.workspace = true
qur_config.workspace = true
qur_editor.workspace = true
qur_git.workspace = true
qur_heat.workspace = true
qur_syntax.workspace = true
qur_theme.workspace = true
qur_tree.workspace = true
qur_watch.workspace = true
qur_worktree.workspace = true
qur_search.workspace = true
alacritty_terminal.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
libc.workspace = true
nucleo-matcher.workspace = true
raw-window-handle = "0.6"
smallvec = "1"
serde_json = "1"
# Agent chat Markdown (MIT). No default features: no CLI, no SIMD.
pulldown-cmark = { version = "0.13", default-features = false }
# To read an image's size before GPUI loads it (chat rows are measured
# once), and to fit pasted images to what the agent takes (files.rs). The
# same crate and formats GPUI already builds.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Dock badge and the alert chime (M6). Same crates GPUI and qur_browser
# already link; only these AppKit classes are added.
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSString"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSDockTile", "NSPasteboard", "NSResponder", "NSSound"] }

