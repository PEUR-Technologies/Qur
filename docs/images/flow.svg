<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff7a45"/>
    </marker>
  </defs>
  <rect width="960" height="250" rx="14" fill="#0b0b0c"/>

  <!-- 1 Start -->
  <g transform="translate(16 16)">
    <rect width="208" height="218" rx="10" fill="#141416" stroke="#2a2a2e"/>
    <rect x="20" y="24" width="168" height="80" rx="6" fill="#1c1c1f"/>
    <text x="32" y="54" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#e8e8e8"><tspan fill="#ff7a45">❯</tspan> claude</text>
    <text x="32" y="82" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#8a8a90">fix the login bug</text>
    <rect x="174" y="70" width="8" height="15" fill="#ff7a45"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
    <text x="104" y="150" text-anchor="middle" font-size="19" font-weight="600" fill="#f2f2f2">1 · Start</text>
    <text x="104" y="176" text-anchor="middle" font-size="13" fill="#9a9aa0">⌘⇧T opens an agent</text>
    <text x="104" y="196" text-anchor="middle" font-size="13" fill="#9a9aa0">on your Claude login</text>
  </g>
  <line x1="228" y1="70" x2="252" y2="70" stroke="#ff7a45" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2 Isolate -->
  <g transform="translate(256 16)">
    <rect width="208" height="218" rx="10" fill="#141416" stroke="#2a2a2e"/>
    <line x1="24" y1="44" x2="184" y2="44" stroke="#5a5a60" stroke-width="3"/>
    <path d="M60 44 C 80 44, 80 88, 104 88 L 184 88" fill="none" stroke="#ff7a45" stroke-width="3"/>
    <circle cx="36" cy="44" r="6" fill="#5a5a60"/><circle cx="60" cy="44" r="6" fill="#5a5a60"/><circle cx="160" cy="44" r="6" fill="#5a5a60"/>
    <circle cx="124" cy="88" r="6" fill="#ff7a45"/><circle cx="168" cy="88" r="6" fill="#ff7a45"/>
    <text x="184" y="34" text-anchor="end" font-size="12" fill="#8a8a90">main (untouched)</text>
    <text x="184" y="110" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#ff7a45">qur/claude/fix-login</text>
    <text x="104" y="150" text-anchor="middle" font-size="19" font-weight="600" fill="#f2f2f2">2 · Isolate</text>
    <text x="104" y="176" text-anchor="middle" font-size="13" fill="#9a9aa0">each agent gets its own</text>
    <text x="104" y="196" text-anchor="middle" font-size="13" fill="#9a9aa0">git worktree</text>
  </g>
  <line x1="468" y1="70" x2="492" y2="70" stroke="#ff7a45" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3 Watch -->
  <g transform="translate(496 16)">
    <rect width="208" height="218" rx="10" fill="#141416" stroke="#2a2a2e"/>
    <rect x="20" y="22" width="168" height="24" rx="4" fill="#ff7a45" opacity="0.4"><animate attributeName="opacity" values="0.45;0.15;0.45" dur="1.6s" repeatCount="indefinite"/></rect>
    <text x="30" y="39" font-size="13" fill="#f2f2f2">auth.rs</text><text x="178" y="39" text-anchor="end" font-size="12" fill="#ff9a6e">+12 −3</text>
    <rect x="20" y="50" width="168" height="24" rx="4" fill="#ff7a45" opacity="0.18"/>
    <text x="30" y="67" font-size="13" fill="#d8d8d8">login.ts</text><text x="178" y="67" text-anchor="end" font-size="12" fill="#ff9a6e">new</text>
    <rect x="20" y="78" width="168" height="24" rx="4" fill="#ff7a45" opacity="0.07"/>
    <text x="30" y="95" font-size="13" fill="#b8b8bc">session.rs</text><text x="178" y="95" text-anchor="end" font-size="12" fill="#8a8a90">read</text>
    <text x="30" y="122" font-size="13" fill="#7a7a80">README.md</text>
    <text x="104" y="150" text-anchor="middle" font-size="19" font-weight="600" fill="#f2f2f2">3 · Watch</text>
    <text x="104" y="176" text-anchor="middle" font-size="13" fill="#9a9aa0">files glow as the agent</text>
    <text x="104" y="196" text-anchor="middle" font-size="13" fill="#9a9aa0">reads and writes them</text>
  </g>
  <line x1="708" y1="70" x2="732" y2="70" stroke="#ff7a45" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4 Merge -->
  <g transform="translate(736 16)">
    <rect width="208" height="218" rx="10" fill="#141416" stroke="#2a2a2e"/>
    <rect x="20" y="22" width="168" height="20" rx="3" fill="#e5484d" opacity="0.22"/>
    <text x="28" y="37" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#ff8f92">− if user == nil {</text>
    <rect x="20" y="44" width="168" height="20" rx="3" fill="#30a46c" opacity="0.25"/>
    <text x="28" y="59" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#7ee2a8">+ guard let user</text>
    <rect x="60" y="76" width="88" height="28" rx="6" fill="#ff7a45"/>
    <text x="104" y="95" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0c">Merge</text>
    <text x="104" y="150" text-anchor="middle" font-size="19" font-weight="600" fill="#f2f2f2">4 · Merge</text>
    <text x="104" y="176" text-anchor="middle" font-size="13" fill="#9a9aa0">review, comment, merge</text>
    <text x="104" y="196" text-anchor="middle" font-size="13" fill="#9a9aa0">into your branch</text>
  </g>
</svg>
