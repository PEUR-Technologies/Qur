  <text x="36" y="108" font-size="13" fill="#f2f2f2">fix login</text><text x="36" y="123" font-size="11" fill="#b8b8bc">terminal · working</text>
  <rect x="24" y="136" width="224" height="40" rx="6" fill="#18181b"/>
  <circle cx="232" cy="156" r="4" fill="#f2f2f2"/>
