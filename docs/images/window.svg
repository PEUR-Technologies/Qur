  <rect x="16" y="314" width="240" height="22" fill="#f2f2f2" opacity="0.2"><animate attributeName="opacity" values="0.28;0.1;0.28" dur="1.4s" repeatCount="indefinite"/></rect>
  <text x="36" y="330" font-size="13" fill="#f2f2f2">auth.rs</text><text x="240" y="330" text-anchor="end" font-size="11" fill="#c8c8cc">+12 −3</text>
