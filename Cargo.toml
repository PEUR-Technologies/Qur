[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.8"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# Shared by several crates. APPEND ONLY: other crates depend on entries you may not see used.
qur_config = { path = "crates/qur_config" }
qur_editor = { path = "crates/qur_editor" }
qur_syntax = { path = "crates/qur_syntax" }
qur_theme = { path = "crates/qur_theme" }
qur_tree = { path = "crates/qur_tree" }
qur_acp = { path = "crates/qur_acp" }
qur_worktree = { path = "crates/qur_worktree" }
qur_agents = { path = "crates/qur_agents" }
qur_watch = { path = "crates/qur_watch" }
qur_heat = { path = "crates/qur_heat" }
alacritty_terminal = { version = "0.26.0", default-features = false }
futures = "0.3"
gpui = { git = "https://github.com/zed-industries/zed", rev = "9e84b066b55bc3609a30dd965075c12255b38b45", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "9e84b066b55bc3609a30dd965075c12255b38b45", default-features = false, features = ["font-kit"] }
ignore = "0.4.33"
libc = "0.2"
nucleo-matcher = "0.3.1"
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
serde = { version = "1.0.229", features = ["derive"] }
toml_edit = { version = "0.25.17", default-features = false, features = ["parse", "display", "serde"] }
tree-sitter = "0.27.1"
qur_browser = { path = "crates/qur_browser" }
qur_git = { path = "crates/qur_git" }
qur_search = { path = "crates/qur_search" }
regex = "1.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
